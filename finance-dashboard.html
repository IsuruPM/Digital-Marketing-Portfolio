<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Money Tracker — AED / LKR</title>
<style>
  :root{
    --bg:#0f141a;--card:#1b2330;--card2:#232d3d;--line:#2d3a4d;
    --text:#eef3f8;--muted:#93a1b5;--accent:#4f9cff;
    --green:#46c66b;--amber:#edb64a;--red:#f6625b;--blue:#5aa6ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.45;font-size:15px}
  .app{max-width:600px;margin:0 auto;padding:16px 14px 96px}
  h1{font-size:19px;margin:0;font-weight:700}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
  .ratebox{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
    background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:10px}
  .ratebox input{width:58px;background:var(--card2);border:1px solid var(--line);color:var(--text);
    padding:4px 6px;border-radius:7px;font-size:13px;text-align:right}
  .tagline{color:var(--muted);font-size:12.5px;margin:0 0 14px}

  /* tabs */
  .tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:5px;position:sticky;top:8px;z-index:5;margin-bottom:16px}
  .tabs button{flex:1;background:none;border:none;color:var(--muted);padding:11px 4px;
    border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
  .tabs button.on{background:var(--accent);color:#fff}

  .page{display:none}
  .page.on{display:block}

  /* summary tiles */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px}
  .tile .k{font-size:12px;color:var(--muted);font-weight:600}
  .tile .v{font-size:22px;font-weight:700;margin-top:6px;letter-spacing:-.4px}
  .tile .u{font-size:11px;color:var(--muted);margin-top:3px}
  .v.green{color:var(--green)} .v.amber{color:var(--amber)} .v.red{color:var(--red)} .v.blue{color:var(--blue)}

  .sec{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:4px 0 10px}
  .mcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px}
  .mcard .mtop{display:flex;justify-content:space-between;font-weight:600}
  .mcard .mbot{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:4px}
  .pos{color:var(--green)} .neg{color:var(--red)}

  /* form */
  .typebtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
  .typebtns button{background:var(--card);border:1px solid var(--line);color:var(--muted);
    padding:13px 4px;border-radius:11px;font-size:13.5px;font-weight:600;cursor:pointer}
  .typebtns button.sel-in{background:var(--green);color:#06230f;border-color:var(--green)}
  .typebtns button.sel-rec{background:var(--amber);color:#2c2203;border-color:var(--amber)}
  .typebtns button.sel-exp{background:var(--red);color:#2e0605;border-color:var(--red)}
  label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 6px;font-weight:600}
  .inp{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);
    padding:13px 12px;border-radius:11px;font-size:16px;margin-bottom:13px}
  .two{display:grid;grid-template-columns:1fr 92px;gap:10px}
  .big{width:100%;background:var(--accent);color:#fff;border:none;padding:15px;border-radius:12px;
    font-size:16px;font-weight:700;cursor:pointer}
  .big:active{filter:brightness(.92)}
  .hintline{font-size:12px;color:var(--muted);margin:-6px 0 14px}

  /* records */
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
  .chips button{background:var(--card);border:1px solid var(--line);color:var(--muted);
    padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .chips button.on{background:var(--card2);color:var(--text);border-color:var(--accent)}
  .rec{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:10px}
  .rec .r1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .rec .desc{font-weight:600}
  .rec .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .rec .amt{text-align:right;white-space:nowrap;font-weight:700}
  .rec .amtlkr{font-size:12px;color:var(--muted);font-weight:400}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;margin-top:6px}
  .b-done{background:rgba(70,198,107,.16);color:var(--green)}
  .b-part{background:rgba(90,166,255,.16);color:var(--blue)}
  .b-pend{background:rgba(237,182,74,.16);color:var(--amber)}
  .b-over{background:rgba(246,98,91,.16);color:var(--red)}
  .r2{display:flex;gap:8px;margin-top:11px;align-items:center}
  .act{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--text);
    padding:9px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
  .act.pay{background:rgba(79,156,255,.15);border-color:var(--accent);color:var(--blue)}
  .act.del{flex:0 0 46px;color:var(--muted)}
  .act.del:active{color:var(--red)}
  .payform{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);display:none}
  .payform.show{display:block}
  .payform .two2{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
  .payform .mini{background:var(--accent);color:#fff;border:none;padding:11px 14px;border-radius:9px;font-weight:700;cursor:pointer}
  .payform .inp{margin-bottom:0}
  .out{color:var(--amber);font-size:12px;margin-top:5px}
  .empty{text-align:center;color:var(--muted);padding:40px 14px}
  .tools{display:flex;gap:8px;margin-top:18px}
  .tools button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--muted);
    padding:10px;border-radius:10px;font-size:12.5px;cursor:pointer}
  footer{color:var(--muted);font-size:11.5px;text-align:center;margin-top:22px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>💰 Money Tracker</h1>
    <div class="ratebox"><span>1 AED =</span><input id="rate" type="number" step="0.01" min="0"><span>LKR</span></div>
  </div>
  <p class="tagline">Income · receivables · expenses in AED &amp; LKR — all totalled in <b>LKR</b>.</p>

  <div class="tabs">
    <button data-tab="sum" class="on">Summary</button>
    <button data-tab="add">＋ Add</button>
    <button data-tab="list">Records</button>
  </div>

  <!-- SUMMARY -->
  <div class="page on" id="p-sum">
    <div class="tiles" id="tiles"></div>
    <div class="sec">Monthly</div>
    <div id="monthly"><div class="empty">No records yet. Tap ＋ Add to start.</div></div>
  </div>

  <!-- ADD -->
  <div class="page" id="p-add">
    <label>What is it?</label>
    <div class="typebtns" id="types">
      <button data-t="income">Income</button>
      <button data-t="receivable">To Receive</button>
      <button data-t="expense">Expense</button>
    </div>
    <label>Description</label>
    <input id="f-desc" class="inp" placeholder="e.g. Client payment / Rent">
    <label id="l-amt">Amount</label>
    <div class="two">
      <input id="f-amt" class="inp" type="number" inputmode="decimal" step="0.01" placeholder="0.00">
      <select id="f-cur" class="inp"><option>AED</option><option>LKR</option></select>
    </div>
    <label id="l-date">Date</label>
    <input id="f-date" class="inp" type="date">
    <div id="paidWrap">
      <label id="l-paid">Already received/paid so far (optional)</label>
      <input id="f-paid" class="inp" type="number" inputmode="decimal" step="0.01" placeholder="0.00">
      <div class="hintline">Leave blank if nothing received/paid yet — you can record it later.</div>
    </div>
    <button class="big" id="addBtn">Add Income</button>
  </div>

  <!-- RECORDS -->
  <div class="page" id="p-list">
    <div class="chips" id="chips">
      <button data-f="all" class="on">All</button>
      <button data-f="receivable">To Receive</button>
      <button data-f="expense">To Pay</button>
      <button data-f="income">Income</button>
      <button data-f="outstanding">Outstanding</button>
    </div>
    <div id="records"></div>
    <div class="tools">
      <button id="exportBtn">⬇ Backup</button>
      <button id="importBtn">⬆ Restore</button>
      <button id="clearBtn">🗑 Clear all</button>
      <input id="importFile" type="file" accept="application/json" style="display:none">
    </div>
  </div>

  <footer>Saved in this browser automatically. Use Backup to save a copy.</footer>
</div>

<script>
(function(){
  "use strict";
  var KEY="moneyTracker.v1", RKEY="moneyTracker.rate";
  var S={items:[],rate:80,type:"income",filter:"all"};

  function load(){
    try{S.items=JSON.parse(localStorage.getItem(KEY))||[];}catch(e){S.items=[];}
    // migrate old v2 if present
    if(!S.items.length){
      try{var o=JSON.parse(localStorage.getItem("finDash.entries.v2"));
        if(Array.isArray(o))S.items=o.map(function(e){return {id:e.id||uid(),type:e.type,desc:e.desc,amount:e.amount,cur:e.cur,date:e.date,due:e.due||"",payments:e.payments||[]};});}catch(e){}
    }
    var r=parseFloat(localStorage.getItem(RKEY));S.rate=(r&&r>0)?r:80;
  }
  function save(){localStorage.setItem(KEY,JSON.stringify(S.items));}
  function saveRate(){localStorage.setItem(RKEY,String(S.rate));}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function lkr(a,c){return c==="AED"?a*S.rate:a;}
  function f0(n){return Number(n).toLocaleString("en-US",{maximumFractionDigits:0});}
  function f2(n){return Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
  function paid(e){return (e.payments||[]).reduce(function(s,p){return s+(+p.amount||0);},0);}
  function out(e){return Math.max(0,e.amount-paid(e));}
  function status(e){ if(e.type==="income")return"done"; if(out(e)<=0.009)return"done"; return paid(e)>0.009?"partial":"pending"; }
  function overdue(e){return status(e)!=="done"&&e.due&&e.due<today();}
  function today(){return new Date().toISOString().slice(0,10);}
  function mkey(d){return (d||"").slice(0,7);}
  function mlabel(k){var M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];var p=k.split("-");return M[(+p[1])-1]+" "+p[0];}

  /* ---------- summary ---------- */
  function totals(){
    var t={inHand:0,toRecv:0,toPay:0};
    S.items.forEach(function(e){
      if(e.type==="income"){t.inHand+=lkr(e.amount,e.cur);}
      else if(e.type==="receivable"){t.inHand+=lkr(paid(e),e.cur);t.toRecv+=lkr(out(e),e.cur);}
      else{t.toPay+=lkr(out(e),e.cur);} // expenses: what's still to pay
    });
    // also count expense amounts already paid as money gone, net cash = inHand - expensesPaid
    var expPaid=0; S.items.forEach(function(e){if(e.type==="expense")expPaid+=lkr(paid(e),e.cur);});
    t.expPaid=expPaid;
    t.netNow=t.inHand-expPaid;
    return t;
  }
  function renderTiles(){
    var t=totals();
    var tiles=[
      {k:"In hand",v:t.inHand,u:"income received",c:"green"},
      {k:"To receive",v:t.toRecv,u:"outstanding",c:"amber"},
      {k:"To pay",v:t.toPay,u:"unpaid expenses",c:"red"},
      {k:"Net now",v:t.netNow,u:"in hand − paid out",c:t.netNow>=0?"blue":"red"}
    ];
    document.getElementById("tiles").innerHTML=tiles.map(function(x){
      return '<div class="tile"><div class="k">'+x.k+'</div><div class="v '+x.c+'">Rs '+f0(x.v)+
        '</div><div class="u">'+x.u+'</div></div>';
    }).join("");
  }
  function renderMonthly(){
    var m={};
    S.items.forEach(function(e){
      if(e.type==="income"){var k=mkey(e.date);if(k){m[k]=m[k]||{i:0,o:0};m[k].i+=lkr(e.amount,e.cur);}}
      (e.payments||[]).forEach(function(p){var k=mkey(p.date||e.date);if(!k)return;m[k]=m[k]||{i:0,o:0};
        if(e.type==="expense")m[k].o+=lkr(+p.amount||0,e.cur);else if(e.type==="receivable")m[k].i+=lkr(+p.amount||0,e.cur);});
    });
    var keys=Object.keys(m).sort().reverse();
    var box=document.getElementById("monthly");
    if(!keys.length){box.innerHTML='<div class="empty">No records yet. Tap ＋ Add to start.</div>';return;}
    box.innerHTML=keys.map(function(k){var r=m[k],net=r.i-r.o;
      return '<div class="mcard"><div class="mtop"><span>'+mlabel(k)+'</span><span class="'+(net>=0?"pos":"neg")+'">'+(net>=0?"+":"−")+"Rs "+f0(Math.abs(net))+'</span></div>'+
        '<div class="mbot"><span>In: Rs '+f0(r.i)+'</span><span>Out: Rs '+f0(r.o)+'</span></div></div>';
    }).join("");
  }

  /* ---------- add ---------- */
  function setType(t){
    S.type=t;
    [].forEach.call(document.getElementById("types").children,function(b){
      b.className=b.dataset.t===t?("sel-"+(t==="income"?"in":t==="receivable"?"rec":"exp")):"";
    });
    document.getElementById("l-amt").textContent=t==="receivable"?"Total to receive":t==="expense"?"Total amount":"Amount received";
    document.getElementById("l-date").textContent=t==="receivable"?"Date raised":"Date";
    document.getElementById("paidWrap").style.display=t==="income"?"none":"block";
    document.getElementById("l-paid").textContent=t==="receivable"?"Already received so far (optional)":"Already paid so far (optional)";
    document.getElementById("addBtn").textContent=t==="income"?"Add Income":t==="receivable"?"Add Receivable":"Add Expense";
  }
  function add(){
    var desc=document.getElementById("f-desc").value.trim()||"(no description)";
    var amt=parseFloat(document.getElementById("f-amt").value);
    var cur=document.getElementById("f-cur").value;
    var date=document.getElementById("f-date").value||today();
    var pd=parseFloat(document.getElementById("f-paid").value)||0;
    if(!amt||amt<=0){alert("Enter a valid amount.");return;}
    var pays=[];
    if(S.type==="income")pays=[{amount:amt,date:date}];
    else if(pd>0)pays=[{amount:Math.min(pd,amt),date:date}];
    S.items.push({id:uid(),type:S.type,desc:desc,amount:amt,cur:cur,date:date,due:"",payments:pays});
    save();renderAll();
    document.getElementById("f-desc").value="";document.getElementById("f-amt").value="";document.getElementById("f-paid").value="";
    go("list");
  }

  /* ---------- records ---------- */
  function keep(e){
    if(S.filter==="all")return true;
    if(S.filter==="outstanding")return (e.type!=="income")&&out(e)>0.009;
    return e.type===S.filter;
  }
  function badge(e){
    if(e.type==="income")return '<span class="badge b-done">Received</span>';
    if(overdue(e))return '<span class="badge b-over">Overdue</span>';
    var s=status(e);
    if(s==="done")return '<span class="badge b-done">'+(e.type==="receivable"?"Received":"Paid")+'</span>';
    if(s==="partial")return '<span class="badge b-part">Part '+(e.type==="receivable"?"received":"paid")+'</span>';
    return '<span class="badge b-pend">'+(e.type==="receivable"?"Not received":"Not paid")+'</span>';
  }
  function renderRecords(){
    var rows=S.items.slice().sort(function(a,b){return (b.date||"").localeCompare(a.date||"");}).filter(keep);
    var box=document.getElementById("records");
    if(!rows.length){box.innerHTML='<div class="empty">Nothing here yet.</div>';return;}
    box.innerHTML=rows.map(function(e){
      var o=out(e),canPay=e.type!=="income";
      var payBtn=canPay&&o>0.009?'<button class="act pay" data-pay="'+e.id+'">'+(e.type==="receivable"?"Record received":"Record paid")+'</button>':'';
      var outLine=canPay&&o>0.009?'<div class="out">Outstanding: '+f2(o)+' '+e.cur+' · Rs '+f0(lkr(o,e.cur))+'</div>':'';
      return '<div class="rec">'+
        '<div class="r1"><div><div class="desc">'+esc(e.desc)+'</div>'+
          '<div class="meta">'+(e.date||"")+' · '+(e.type==="income"?"Income":e.type==="receivable"?"To receive":"Expense")+'</div>'+badge(e)+'</div>'+
          '<div class="amt">'+f2(e.amount)+' '+e.cur+'<div class="amtlkr">Rs '+f0(lkr(e.amount,e.cur))+'</div></div></div>'+
        outLine+
        '<div class="r2">'+payBtn+'<button class="act del" data-del="'+e.id+'">🗑</button></div>'+
        '<div class="payform" id="pf-'+e.id+'"><div class="two2">'+
          '<div><label>Amount</label><input class="inp" id="pa-'+e.id+'" type="number" inputmode="decimal" step="0.01" value="'+(o>0?o.toFixed(2):"")+'"></div>'+
          '<div><label>Date</label><input class="inp" id="pd-'+e.id+'" type="date" value="'+today()+'"></div>'+
          '<button class="mini" data-save="'+e.id+'">Save</button>'+
        '</div></div>'+
      '</div>';
    }).join("");
  }

  function recordPay(id){
    var e=S.items.find(function(x){return x.id===id;});if(!e)return;
    var amt=parseFloat(document.getElementById("pa-"+id).value);
    var d=document.getElementById("pd-"+id).value||today();
    if(!amt||amt<=0){alert("Enter an amount.");return;}
    if(amt>out(e)+0.009&&!confirm("More than outstanding — record anyway?"))return;
    e.payments=e.payments||[];e.payments.push({amount:amt,date:d});
    save();renderAll();
  }

  function renderAll(){renderTiles();renderMonthly();renderRecords();}

  /* ---------- nav ---------- */
  function go(tab){
    [].forEach.call(document.querySelectorAll(".tabs button"),function(b){b.classList.toggle("on",b.dataset.tab===tab);});
    [].forEach.call(document.querySelectorAll(".page"),function(p){p.classList.remove("on");});
    document.getElementById("p-"+tab).classList.add("on");
    window.scrollTo(0,0);
  }

  /* ---------- events ---------- */
  document.querySelector(".tabs").addEventListener("click",function(ev){var b=ev.target.closest("button");if(b)go(b.dataset.tab);});
  document.getElementById("types").addEventListener("click",function(ev){var b=ev.target.closest("button");if(b)setType(b.dataset.t);});
  document.getElementById("addBtn").addEventListener("click",add);
  document.getElementById("chips").addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;
    S.filter=b.dataset.f;[].forEach.call(this.children,function(x){x.classList.toggle("on",x===b);});renderRecords();});

  document.getElementById("records").addEventListener("click",function(ev){
    var pay=ev.target.closest("[data-pay]"),del=ev.target.closest("[data-del]"),sv=ev.target.closest("[data-save]");
    if(pay){var pf=document.getElementById("pf-"+pay.getAttribute("data-pay"));pf.classList.toggle("show");return;}
    if(sv){recordPay(sv.getAttribute("data-save"));return;}
    if(del){var id=del.getAttribute("data-del");if(confirm("Delete this record?")){S.items=S.items.filter(function(e){return e.id!==id;});save();renderAll();}}
  });

  var rate=document.getElementById("rate");
  rate.addEventListener("input",function(){var v=parseFloat(rate.value);if(v&&v>0){S.rate=v;saveRate();renderAll();}});

  document.getElementById("exportBtn").addEventListener("click",function(){
    var blob=new Blob([JSON.stringify({rate:S.rate,items:S.items},null,2)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="money-tracker-"+today()+".json";a.click();
  });
  document.getElementById("importBtn").addEventListener("click",function(){document.getElementById("importFile").click();});
  document.getElementById("importFile").addEventListener("change",function(ev){
    var fl=ev.target.files[0];if(!fl)return;var r=new FileReader();
    r.onload=function(){try{var d=JSON.parse(r.result);var it=Array.isArray(d)?d:d.items;if(!Array.isArray(it))throw 0;
      if(!confirm("Restore "+it.length+" records? Replaces current data."))return;
      S.items=it;if(d.rate){S.rate=d.rate;rate.value=d.rate;saveRate();}save();renderAll();go("sum");
    }catch(e){alert("Could not read that file.");}};r.readAsText(fl);ev.target.value="";});
  document.getElementById("clearBtn").addEventListener("click",function(){
    if(confirm("Delete ALL records? Backup first if needed.")){S.items=[];save();renderAll();}});

  /* ---------- init ---------- */
  load();
  rate.value=S.rate;
  document.getElementById("f-date").value=today();
  setType("income");renderAll();
})();
</script>
</body>
</html>
